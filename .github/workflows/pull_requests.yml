name: Pull_Request_Validation

on:
  pull_request:
    branches: [ "main" ]

  workflow_dispatch:

jobs:
  build-library:
    name: Build Library
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://npm.pkg.github.com/

      - name: Install Dependencies
        run: npm ci

      - name: Check Formatting
        run: npm run format:check
        
      - name: Lint
        run: npm run lint

      - name: Build Library
        run: npm run build:library

      - uses: actions/upload-artifact@v4
        with:
          name: library-package
          path: dist/ng-form-cache

  compatibility:
    name: Angular ${{ matrix.angular }} compatibility
    needs: build-library
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        angular: ['20.0', '20', '21', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: library-package
          path: dist/ng-form-cache
      - name: Compile consumer and run browser tests against packaged library
        run: npm run test:compatibility -- ${{ matrix.angular }}

  build-sample-app:
    name: Build Sample App
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://npm.pkg.github.com/

      - name: Install Dependencies
        run: npm ci

      - name: Build Sample Application
        run: npm run build:app

  build-documentation:
    name: Build Documentation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://npm.pkg.github.com/

      - name: Install Dependencies
        run: cd docs/ng-form-cache && npm ci

      - name: Build Documentation
        run: cd docs/ng-form-cache && npm run build
